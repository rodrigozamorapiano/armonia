html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.62 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#app{max-width:860px;margin:0 auto;padding-block:20px 56px}
h1,h2,h3{font-family:var(--disp);color:#fff;font-weight:600;margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(2.2rem,7vw,3.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,4.6vw,2.15rem)}
h3{font-size:1.3rem}
p{margin:0 0 .85rem}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600;margin:0 0 .5rem}
.mut{color:var(--mut)}
.btn{font:600 15px/1 var(--body);background:#fff;color:#0B1B44;border:0;border-radius:10px;padding:.8rem 1.3rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:#E4ECFF}
.btn:disabled{opacity:.32;cursor:default}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--s1)}
.btn.sm{padding:.55rem .95rem;font-size:14px}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3.5vw,28px)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--disp);font-size:1.5rem;color:#fff;font-weight:600}
.brand span{color:var(--acc)}
/* home */
.hero{padding:10px 0 26px}
.hero p{max-width:60ch;color:var(--mut);font-size:1.05rem}
.cont{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.blk{margin-top:30px}
.blk h3{margin-bottom:10px}
.tl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tp{display:flex;gap:12px;align-items:center;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);font:500 15px/1.3 var(--body);min-width:0}
.tp .n{font-family:var(--disp);font-size:1.35rem;color:var(--acc);min-width:1.7em;font-weight:600}
.tp small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
.tp.on{background:var(--s1);border-color:var(--acc);cursor:pointer}
.tp.on:hover{background:#12285A}
.tp.off{opacity:.55}
.etapas{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:14px 0 0;padding:0;list-style:none;counter-reset:e}
.etapas li{counter-increment:e;font-size:14px;color:var(--mut);display:flex;gap:8px}
.etapas li:before{content:counter(e);color:var(--acc);font-weight:700}
/* lesson */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 0 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--s2);color:var(--mut);border-radius:99px;padding:6px 12px;font:600 12px/1 var(--body);cursor:pointer;white-space:nowrap}
.chip.cur{background:#fff;color:#0B1B44;border-color:#fff}
.chip.dn{color:var(--ink);border-color:var(--acc)}
.chip:disabled{opacity:.35;cursor:default}
.stephead{margin:20px 0 14px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.lbl{font-size:13px;color:var(--mut)}
.def{border-left:3px solid var(--acc);background:var(--s2);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 1rem}
.def b{color:#fff}
.q{margin:0 0 20px}
.q .qt{font-weight:600;color:#fff;margin-bottom:.6rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:500 15px/1.3 var(--body);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:.65rem 1rem;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:rgba(95,211,154,.13);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(255,154,133,.12);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:.6rem;font-size:14.5px;color:var(--mut)}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{color:#fff;font-weight:600}
.scroll{overflow-x:auto}
.svgbox{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.svgbox svg{display:block;margin:0 auto;width:100%;height:auto}
.nt{color:var(--staff)}
.nt.hl{color:var(--acc)}
.nt.ok{color:var(--ok)}
.nt.bad{color:var(--bad)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(91,155,255,.16)}
.wk{fill:#F3F6FF;stroke:#1B2F63;stroke-width:1;cursor:pointer}
.wk.hl{fill:#9CC3FF}.wk.ok{fill:#8DE3B8}.wk.bad{fill:#FFB5A5}.wk.tn{fill:#5B9BFF}
.bk{fill:#0B1636;stroke:#000;cursor:pointer}
.bk.hl{fill:#3F78D6}.bk.ok{fill:#2E9D6E}.bk.bad{fill:#C4604E}.bk.tn{fill:#5B9BFF}
.kl{font:600 9px var(--body);fill:#33466F;pointer-events:none}
.sec{fill:var(--s1);stroke:var(--bg);stroke-width:2;cursor:pointer}
.sec.m{fill:#10265A}
.sec:hover{fill:#1B3A82}
.sec.sel{fill:#5B9BFF}
.sec.ok{fill:#2E9D6E}.sec.bad{fill:#C4604E}
.wt{font:600 15px var(--body);fill:#fff;pointer-events:none}
.wt.sm{font-size:12px}
.wt.sg{font-size:11px;fill:var(--mut)}
.sec.sel+.wt{fill:#07122B}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--mut);background:var(--s2)}
.info{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;min-height:4.4em}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0}
.gc{background:var(--s2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;text-align:left;cursor:pointer;font:500 14px/1.3 var(--body)}
.gc b{display:block;font-family:var(--disp);font-size:1.4rem;color:#fff}
.gc.seen{border-color:var(--acc)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .ml{min-width:7.5em;font-weight:600;color:#fff}
.mrow .opt{padding:.45rem .8rem;font-size:14px}
.fin{text-align:center;padding:22px 0}
.fin .big{font-family:var(--disp);font-size:3.4rem;color:#fff;line-height:1}
@media(max-width:520px){.btn{padding:.8rem 1rem}.foot .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
